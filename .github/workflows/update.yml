# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Update stubs"
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
  schedule:
    # * is a special character in YAML so you have to quote this string
      - cron: '0 0 * * *'

permissions:
  contents: read

# Cancel superseded pull request runs; queue runs on main so a commit and tag are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    name: "Update stubs"
    runs-on: "ubuntu-latest"
    environment:
      name: ${{ github.event_name != 'pull_request' && 'push' || '' }}
      deployment: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: "Mint a push token for phpstan/php-8-stubs"
        id: push-token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PUSH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_APP_PRIVATE_KEY }}
          repositories: php-8-stubs
          permission-contents: write

      # git-auto-commit-action pushes with the credentials persisted by this checkout.
      - name: "Checkout to commit" # zizmor: ignore[artipacked]
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          token: ${{ steps.push-token.outputs.token }}
      - name: "Checkout to only read"
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.3"
      - name: "Install dependencies"
        run: "composer install"
        working-directory: ./extractor
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.0"
      - name: "Extract stubs"
        run: "./extractor/extract.php"

      # repeat
      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.1"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.1"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.0 8.1"

      # ---

      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.2"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.2"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.1 8.2"

      # ---

      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.3"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.3"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.2 8.3"

      # ---

      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.4"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.4"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.3 8.4"

      # ---

      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.5"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.5"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.4 8.5"

      # ---

      - name: "Delete checked out php-src repo"
        run: "rm -rf php-src"
      - name: "Checkout PHP 8.6"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "php/php-src"
          path: "php-src"
          persist-credentials: false
          ref: "PHP-8.6"
      - name: "Update stubs"
        run: "./extractor/extract.php --update -- 8.5 8.6"

      # end repeat

      - name: 'Get previous tag'
        id: previous_tag
        uses: "WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206" # v2.1.0
        with:
          fallback: 0.1.0
      - name: 'Get next minor version'
        id: semvers
        uses: "WyriHaximus/github-action-next-semvers@18aa9ed4152808ab99b88d71f5481e41f8d89930" # v1.2.1
        with:
          version: ${{ steps.previous_tag.outputs.tag }}
      - name: "Commit changes"
        if: github.event_name != 'pull_request'
        uses: "stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c" # v7.2.1
        id: "commit"
        with:
          commit_message: "Update stubs"
          commit_user_name: "phpstan-bot"
          commit_user_email: "ondrej+phpstanbot@mirtes.cz"
          commit_author: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"

      # Only the phpstan-release App may create tags: ask phpstan/release to
      # tag the new commit, which waits for approval there.
      - name: "Request the tag from phpstan/release"
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          TAG: ${{ steps.semvers.outputs.patch }}
        run: |
          gh workflow run tag.yml --repo phpstan/release \
            -f repository=php-8-stubs -f tag="$TAG" -f branch=main
          echo "Requested $TAG. Approve it at https://github.com/phpstan/release/actions" >> "$GITHUB_STEP_SUMMARY"
      - name: "Show diff"
        if: github.event_name == 'pull_request'
        run: "git diff"
