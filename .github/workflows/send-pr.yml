# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Send pull request"

on:
  release:
    types: [published]

permissions:
  contents: read

# Every release needs its own pull request, so queue runs instead of cancelling them.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  send-pr:
    name: "Send pull request"
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # 2.40.0
        with:
          coverage: "none"
          php-version: "8.3"

      - name: "Checkout phpstan-src"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: phpstan/phpstan-src
          ref: 2.3.x
          path: phpstan-src
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          persist-credentials: false

      - name: "Install dependencies"
        working-directory: ./phpstan-src
        run: "composer install --no-interaction --no-progress --no-suggest"

      - name: "Write pull request body"
        working-directory: ./phpstan-src
        env:
          NEW_VERSION: ${{ github.ref_name }}
        run: |
          old_version="$(composer info phpstan/php-8-stubs --format json | jq --raw-output '.versions[0]')"
          echo "Update PHP 8 stubs to ${NEW_VERSION}: https://github.com/phpstan/php-8-stubs/compare/${old_version}...${NEW_VERSION}" > "${RUNNER_TEMP}/pr-body.md"

      - name: "Change composer.json"
        working-directory: ./phpstan-src
        env:
          NEW_VERSION: ${{ github.ref_name }}
        run: composer require "phpstan/php-8-stubs:${NEW_VERSION}"

      - name: "Create Pull Request"
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          path: ./phpstan-src
          branch-suffix: random
          delete-branch: true
          title: "Update PHP 8 stubs to ${{ github.ref_name }}"
          body-path: ${{ runner.temp }}/pr-body.md
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit-message: "Update PHP 8 stubs"
