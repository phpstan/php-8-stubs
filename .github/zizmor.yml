rules:
  secrets-outside-env:
    # release.yml uses the PHPSTAN_BOT_CONTENTS_TOKEN org secret so that its release
    # triggers send-pr.yml; update.yml requests tags with RELEASE_DISPATCH_TOKEN.
    ignore:
      - release.yml
      - send-pr.yml
      - update.yml
  superfluous-actions:
    # These actions do more than a single CLI call (tagging, release creation, branch
    # handling), and replacing them would change how releases are produced.
    ignore:
      - release.yml
      - send-pr.yml
      - update.yml
